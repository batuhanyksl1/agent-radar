<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Radar</title>
<style>
:root {
  --bg: #121216; --panel: #1a1a20; --card: rgba(255,255,255,.045); --line: rgba(255,255,255,.09);
  --text: #ececf1; --dim: #9a9aa6; --soft: #b9b9c4;
  --green: #34d399; --amber: #fbbf24; --red: #f87171; --gray: #8b8b98; --cyan: #67e8f9;
  --read: #60a5fa; --write: #c084fc; --run: #34d399; --handoff: #fbbf24; --web: #22d3ee; --other: #94a3b8;
}
@media (prefers-color-scheme: light) {
  :root { --bg: #f5f5f7; --panel: #fff; --card: rgba(0,0,0,.035); --line: rgba(0,0,0,.1);
    --text: #17171c; --dim: #5b5b66; --soft: #3d3d47; --cyan: #0e7490; --amber: #b45309; --green: #059669; --red: #dc2626; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 14px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line); }
header h1 { font-size: 17px; margin: 0; letter-spacing: -.01em; }
.conn { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); font-size: 12px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gray); display: inline-block; flex: none; }
.dot.green { background: var(--green); } .dot.amber { background: var(--amber); } .dot.red { background: var(--red); }
.pulse { animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .25; } }
.spacer { flex: 1; }
label.opt { color: var(--dim); font-size: 12.5px; display: inline-flex; gap: 6px; align-items: center; cursor: pointer; min-height: 44px; }
main { padding: 20px 24px 88px; max-width: 1500px; margin: 0 auto; display: grid; gap: 28px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.tile { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 16px; }
.tile b { font-size: 26px; font-variant-numeric: tabular-nums; margin-left: 8px; }
.tile span { display: block; color: var(--dim); font-size: 12px; margin-top: 2px; }
.sessions { display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 560px), 1fr)); align-items: start; }
section.session { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; min-width: 0; }
section.session.dead { opacity: .55; }
.shead { display: flex; align-items: baseline; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.shead h2 { font-size: 15px; margin: 0; }
.shead .path { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.shead .sum { color: var(--dim); font-size: 12px; font-variant-numeric: tabular-nums; }
.tree { display: grid; gap: 10px; }
.node { position: relative; }
.node > .kids { margin-left: 30px; margin-top: 10px; display: grid; gap: 10px; position: relative; }
.node > .kids > .node::before { content: ""; position: absolute; left: -15px; top: -10px; width: 15px; height: 36px;
  border-left: 1.5px solid var(--line); border-bottom: 1.5px solid var(--line); border-bottom-left-radius: 9px; }
.node > .kids > .node:not(:last-child)::after { content: ""; position: absolute; left: -15px; top: 0; bottom: -10px;
  border-left: 1.5px solid var(--line); }
.node.live > .kids > .node.live::before { border-color: var(--edge, var(--green)); border-left-style: dashed; border-bottom-style: dashed; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 14px 10px 12px;
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 10px; cursor: pointer; min-height: 56px;
  transition: background .15s ease; }
.card:hover { background: color-mix(in srgb, var(--card) 60%, var(--line)); }
.card.live { border-color: color-mix(in srgb, var(--accent) 55%, transparent); }
.card.done { opacity: .62; }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff;
  font-size: 11.5px; font-weight: 700; position: relative; margin-top: 2px; }
.avatar i { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%;
  background: var(--accent); border: 2px solid var(--panel); }
.avatar.beat::before { content: ""; position: absolute; inset: 0; border-radius: 50%; border: 2px solid var(--accent);
  animation: beat 1.6s ease-out infinite; }
@keyframes beat { from { transform: scale(1); opacity: .7; } to { transform: scale(1.7); opacity: 0; } }
.l1 { display: flex; gap: 8px; align-items: baseline; }
.l1 .name { font-weight: 700; font-size: 14px; white-space: nowrap; }
.l1 .role { color: var(--dim); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; flex: 1; }
.l1 .state { color: var(--accent); font-size: 12px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.task { color: var(--soft); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nowl { font-size: 12.5px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; }
.nowl.cyan { color: var(--cyan); } .nowl.yellow { color: var(--amber); } .nowl.red { color: var(--red); }
.strip { display: flex; gap: 3px; align-items: center; margin-top: 7px; flex-wrap: wrap; }
.sq { width: 9px; height: 9px; border-radius: 2.5px; flex: none; }
.strip .count { margin-left: auto; color: var(--dim); font-size: 11.5px; font-variant-numeric: tabular-nums; }
.k-read { background: var(--read); } .k-write { background: var(--write); } .k-run { background: var(--run); }
.k-handoff { background: var(--handoff); } .k-web { background: var(--web); } .k-other { background: var(--other); }
.k-error { background: var(--red); }
.hist { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-top: 8px; padding-top: 8px; display: grid; gap: 3px;
  font-size: 12.5px; max-height: 340px; overflow: auto; cursor: default; }
.hist .row { display: grid; grid-template-columns: 12px 120px minmax(0, 1fr) auto; gap: 8px; align-items: center; }
.hist .tool { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .what { color: var(--soft); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist .when { color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tl { margin-top: 18px; }
.tl h3 { font-size: 13px; margin: 0 0 8px; display: flex; justify-content: space-between; align-items: baseline; }
.tl h3 small { color: var(--dim); font-weight: 400; }
.lane { display: grid; grid-template-columns: 110px minmax(0, 1fr); align-items: center; height: 22px; }
.lane .who { color: var(--soft); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.lane .track { position: relative; height: 100%;
  background: repeating-linear-gradient(to right, var(--line) 0 1px, transparent 1px 25%); }
.lane .life { position: absolute; top: 9px; height: 4px; border-radius: 2px; opacity: .3; }
.lane .bar { position: absolute; top: 5px; height: 12px; border-radius: 3px; min-width: 3px; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; color: var(--dim); font-size: 11.5px; margin-top: 10px; }
.legend span { display: inline-flex; gap: 5px; align-items: center; }
.tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: thin; }
.tab { flex: none; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--card); color: var(--soft); font: inherit; font-size: 13px; cursor: pointer; max-width: 300px; }
.tab:hover { color: var(--text); }
.tab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.tab .lbl { display: grid; text-align: left; line-height: 1.25; min-width: 0; }
.tab .lbl .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.tab .lbl .p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 11px; opacity: .7; }
.tab { padding-top: 6px; padding-bottom: 6px; }
.tab .n { font-variant-numeric: tabular-nums; font-size: 11.5px; opacity: .75; }
.tab.dead { opacity: .55; }
.sessions.one { grid-template-columns: minmax(0, 1fr); }
.empty { color: var(--dim); text-align: center; padding: 56px 16px; border: 1px dashed var(--line); border-radius: 18px; }
.empty b { color: var(--text); display: block; font-size: 15px; margin-bottom: 6px; }
@media (max-width: 640px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } main, header { padding-left: 16px; padding-right: 16px; } }
@media (prefers-reduced-motion: reduce) { .pulse, .avatar.beat::before, .side { animation: none; } }
select.lang { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 12.5px; min-height: 32px; }
.badge { font-size: 11px; color: var(--amber); border: 1px solid color-mix(in srgb, var(--amber) 50%, transparent); border-radius: 999px; padding: 2px 8px; }
.shead .proj { color: var(--soft); font-weight: 600; font-size: 12px; white-space: nowrap; }
.x { flex: none; width: 26px; height: 26px; display: inline-grid; place-items: center; padding: 0; border: 0; border-radius: 7px;
  background: transparent; color: var(--dim); font: inherit; font-size: 16px; line-height: 1; cursor: pointer; }
.x:hover, .x:focus-visible { background: var(--line); color: var(--text); }
.tabw { position: relative; flex: none; display: inline-flex; }
.tabw .tab { padding-right: 36px; }
.tabw .x { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); }
.tab.on + .x { color: var(--bg); } .tab.on + .x:hover, .tab.on + .x:focus-visible { background: color-mix(in srgb, var(--bg) 22%, transparent); }
.card.sel { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 65%, transparent); }
.card:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
.l1 .x { align-self: center; margin: -4px -6px -4px 0; }
.use { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; white-space: nowrap; border: 1px solid var(--line); border-radius: 999px; padding: 0 7px; }
.stuck { color: var(--amber); font-size: 11px; white-space: nowrap; opacity: .85; cursor: help; }
.shead .x { align-self: center; }
.btn { background: var(--card); color: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 0 10px; font: inherit; font-size: 12.5px; min-height: 32px; cursor: pointer; white-space: nowrap; }
.btn:hover, .btn:focus-visible { color: var(--text); }
.pop { position: fixed; right: 24px; z-index: 8; width: min(400px, calc(100vw - 32px)); max-height: 70vh; overflow: auto; display: grid; gap: 8px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; box-shadow: 0 14px 40px rgba(0,0,0,.35); }
.pop[hidden] { display: none; }
.pop h3 { font-size: 13px; margin: 0; }
.pop p { color: var(--dim); font-size: 12px; margin: 0; }
.hrow { display: flex; gap: 10px; align-items: center; min-height: 40px; border-top: 1px solid var(--line); padding-top: 8px; }
.hrow .hn { display: grid; min-width: 0; flex: 1; line-height: 1.3; }
.hrow .hn b, .hrow .hn small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hrow .hn small { color: var(--dim); font-size: 11.5px; }
.attn { display: grid; gap: 6px; }
.attn:empty { display: none; }
.alert { display: flex; gap: 10px; align-items: center; padding: 4px 6px 4px 12px; border-radius: 10px; font-size: 12.5px; min-height: 38px;
  border: 1px solid color-mix(in srgb, var(--red) 45%, transparent); background: color-mix(in srgb, var(--red) 8%, transparent); }
.alert span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.alert.note { border-color: var(--line); background: var(--card); color: var(--dim); }
.side { position: fixed; top: 0; right: 0; bottom: 0; z-index: 10; width: min(560px, 100vw); display: flex; flex-direction: column;
  background: var(--panel); border-left: 1px solid var(--line); box-shadow: -14px 0 40px rgba(0,0,0,.3); animation: slide .18s ease-out; }
.side[hidden] { display: none; }
@keyframes slide { from { transform: translateX(28px); opacity: 0; } }
.sidehead { display: flex; gap: 10px; align-items: center; padding: 14px 16px 10px; }
.sidet { display: grid; min-width: 0; flex: 1; line-height: 1.3; }
.sidet b, .sidet span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sidet b { font-size: 15px; } .sidet span { color: var(--dim); font-size: 12px; }
.stabs { display: flex; gap: 6px; padding: 0 16px 10px; border-bottom: 1px solid var(--line); }
.stab { min-height: 32px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--soft); font: inherit; font-size: 12.5px; cursor: pointer; }
.stab.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.sidebody { flex: 1; overflow: auto; padding: 14px 16px 28px; }
.sidebody[hidden] { display: none; }
.sidebody .hist { border: 0; margin: 0; padding: 0; max-height: none; }
.chat { display: grid; gap: 8px; align-content: start; }
.cnote { color: var(--dim); font-size: 12.5px; text-align: center; padding: 6px 0; }
.cnote:empty { display: none; }
.msg { max-width: 92%; justify-self: start; padding: 8px 12px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); font-size: 13px; }
.msg.user { justify-self: end; background: color-mix(in srgb, var(--cyan) 11%, var(--card)); }
.mlbl { color: var(--dim); font-size: 11px; font-weight: 600; margin-bottom: 3px; }
.mlbl:empty { display: none; }
.mtext { white-space: pre-wrap; overflow-wrap: anywhere; }
.mtext pre { font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; background: var(--bg); border: 1px solid var(--line); border-radius: 8px;
  padding: 8px 10px; margin: 6px 0; overflow: auto; white-space: pre; }
.chip { display: flex; gap: 7px; align-items: center; min-width: 0; font-size: 12px; padding: 1px 4px; }
.chip b { white-space: nowrap; color: var(--soft); }
.chip .cs { color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip.err b, .chip.err .cs { color: var(--red); }
</style>
</head>
<body>
<header>
  <h1>Agent Radar</h1>
  <span class="conn"><span class="dot" id="connDot"></span><span id="connText"></span></span>
  <span class="badge" id="demoBadge" hidden></span>
  <span class="spacer"></span>
  <button class="btn" id="hiddenBtn" aria-expanded="false" aria-controls="hiddenBox" hidden></button>
  <label class="opt"><input type="checkbox" id="optDone" checked> <span id="lblDone"></span></label>
  <label class="opt"><input type="checkbox" id="optDead"> <span id="lblDead"></span></label>
  <select class="lang" id="lang" aria-label="Language"></select>
</header>
<div class="pop" id="hiddenBox" role="dialog" aria-labelledby="hiddenHead" hidden><h3 id="hiddenHead"></h3><p id="hiddenNote"></p><div id="hiddenList"></div></div>
<aside class="side" id="side" aria-labelledby="sideName" hidden>
  <div class="sidehead"><div class="sidet"><b id="sideName"></b><span id="sideSub"></span></div><button class="x" id="sideClose"></button></div>
  <div class="stabs" role="tablist"><button class="stab" id="stChat" role="tab" aria-controls="chatBox"></button><button class="stab" id="stHist" role="tab" aria-controls="histBox"></button></div>
  <div class="sidebody" id="chatBox" role="tabpanel"><div class="chat"><div class="cnote" id="chatOlder"></div><div class="chat" id="chatList"></div><div class="cnote" id="chatNote"></div></div></div>
  <div class="sidebody" id="histBox" role="tabpanel" hidden></div>
</aside>
<main>
  <div class="attn" id="attn"></div>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <div class="tiles" id="tiles"></div>
  <div class="sessions" id="sessions"></div>
</main>
<script type="module">
import { LANGUAGE_NAMES, MESSAGES, pickLang, tr } from './i18n.js'
import { demoChat, demoHide, demoSessions } from './demo.js'

const query = new URLSearchParams(location.search)
const DEMO = query.has('demo')
const LIVE = new Set(['pending', 'running', 'waiting', 'idle'])
const STATUS = {
  pending: ['var(--green)', 'stStarting'], running: ['var(--green)', 'stRunning'], waiting: ['var(--amber)', 'stWaiting'],
  idle: ['var(--amber)', 'stIdle'], completed: ['var(--gray)', 'stDone'], failed: ['var(--red)', 'stFailed'], killed: ['var(--red)', 'stStopped'],
}
const KINDS = { read: 'kRead', write: 'kWrite', run: 'kRun', handoff: 'kHandoff', web: 'kWeb', other: 'kOther', error: 'kError' }
const STUCK_MS = 5 * 60 * 1000
let data = null, skew = 0, lastOk = 0, pollNo = 0, notice = ''
// The selected tab: 'all' or a session's sid. Sessions keep the order in which
// the page first saw them, so the one that updated last does not jump around.
let tab = query.get('tab') || 'all'
try { tab = query.get('tab') || localStorage.getItem('agent-radar-tab') || 'all' } catch {}
const order = new Map()
let lang = pickLang(query.get('lang') || localStorage.getItem('agent-radar-lang') || navigator.language)
const T = (key, params) => tr(lang, key, params)
const $ = id => document.getElementById(id)

// Hiding. `over` holds what the person just changed ('sid' or 'sid run' -> hidden),
// applied on top of the server's answer until a poll started after the change lands.
// HID is recomputed on each render: sid -> { s: session hidden, own: hidden run ids,
// all: Map(run id -> the hidden run it sits under) }.
const over = new Map()
let HID = new Map()
function hiddenOf(s) {
  const own = new Set(s.hiddenRuns ?? [])
  for (const [k, o] of over) { const [sid, run] = k.split(' '); if (sid === s.sid && run) o.v ? own.add(run) : own.delete(run) }
  const byId = new Map(s.runs.map(r => [r.id, r])), all = new Map()
  for (const r of s.runs) for (let x = r, n = 0; x && n < 64; x = byId.get(x.parentId), n++) if (own.has(x.id)) { all.set(r.id, x.id); break }
  return { s: over.get(s.sid)?.v ?? !!s.hidden, own, all }
}

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]))
const ago = ms => {
  const s = Math.max(0, Math.round(ms / 1000)), S = T('uSec'), M = T('uMin'), H = T('uHour')
  if (s < 60) return s + S
  const m = Math.floor(s / 60)
  return m < 60 ? `${m}${M} ${s % 60}${S}` : `${Math.floor(m / 60)}${H} ${m % 60}${M}`
}
const took = (a, now) => { const ms = (a.endedAt ?? now) - a.startedAt; return ms < 1000 ? (ms / 1000).toFixed(1) + T('uSec') : ago(ms) }
const isHandoff = a => a.tool === 'Agent' || a.tool === 'Task'
const toolLabel = t => t === 'Agent' || t === 'Task' ? T('toolHandoff') : t === 'SendMessage' ? T('toolMessage') : t
const kindOf = a => a.isError ? 'error' : ['Read', 'Grep', 'Glob'].includes(a.tool) ? 'read' : ['Edit', 'Write', 'NotebookEdit'].includes(a.tool) ? 'write'
  : a.tool === 'Bash' ? 'run' : ['Agent', 'Task', 'SendMessage'].includes(a.tool) ? 'handoff' : ['WebFetch', 'WebSearch'].includes(a.tool) ? 'web' : 'other'
const hueOf = k => { let h = 0; for (const c of k) h = (h * 31 + c.charCodeAt(0)) % 360; return h }
const initials = n => { const p = n.split(/[\s:-]+/).filter(Boolean); return ((p[0]?.[0] ?? '?') + (p.length > 1 ? p[1][0] : (p[0]?.[1] ?? ''))).toLocaleUpperCase(lang) }
const folderOf = s => (s.cwd || '').split('/').filter(Boolean).pop() || ''
const titleOf = s => s.title || folderOf(s) || T('untitled')
const whoOf = (s, r) => r === s.root ? T('main') : (s.people ?? []).find(p => p.slug === r.type)?.name ?? r.type
const runOf = (s, run) => run === 'main' ? s.root : s.runs.find(r => r.id === run)
// claude-opus-5 -> Opus 5, claude-haiku-5-5 -> Haiku 5.5; other ids stay as they are.
const shortModel = id => { const m = /^claude-([a-z]+)-(\d+)(?:-(\d{1,2}))?(?:-\d{8})?$/.exec(id ?? ''); return m ? m[1][0].toUpperCase() + m[1].slice(1) + ' ' + m[2] + (m[3] ? '.' + m[3] : '') : String(id ?? '') }
const fmtN = n => n < 1000 ? String(n) : n < 1e5 ? (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'k' : n < 1e6 ? Math.round(n / 1e3) + 'k' : (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M'
const num = n => Number(n || 0).toLocaleString(lang)
const useHtml = u => u ? `<span class="use" title="${esc(T('usageTip', { a: num(u.in), b: num(u.cached), c: num(u.out) }))}">${esc(shortModel(u.model))} · ${fmtN((u.in || 0) + (u.out || 0))}</span>` : ''
function stuckOf(r, now) {
  if (r.active.some(a => !isHandoff(a) && now - a.startedAt > STUCK_MS)) return 'stuckLong'
  const last = r.tools.slice(-3)
  return last.length === 3 && last.every(a => a.isError) ? 'stuckErr' : ''
}

function nowLine(r, all, nameOf, now) {
  if (r.ask) return ['red', '🔒 ' + T('nowAsk', { x: r.ask })]
  if (!LIVE.has(r.status)) return null
  const kids = all.filter(k => k.parentId === r.id && LIVE.has(k.status) && k.status !== 'idle')
  const working = r.active.filter(a => !isHandoff(a))
  if (r.status === 'running' && working.length) return ['cyan', working.map(a => `▸ ${toolLabel(a.tool)}: ${a.summary} · ${took(a, now)}`).join('   ')]
  if (kids.length) return ['yellow', '⏳ ' + T('nowWaitAgents', { x: kids.map(k => nameOf(k.type)).join(', ') })]
  const h = r.active.find(isHandoff)
  if (h) return ['yellow', '⏳ ' + T('nowWaitHandoff', { x: h.summary })]
  if (working.length) return ['yellow', '⏳ ' + T('nowWaitTool', { x: `${toolLabel(working[0].tool)}: ${working[0].summary}` })]
  if (r.status === 'idle') return ['yellow', '⏸ ' + T('nowIdle')]
  if (r.status === 'waiting') return ['yellow', '⏳ ' + T('nowWaitBg')]
  if (r.status === 'pending') return ['cyan', T('nowStarting')]
  return ['cyan', '💭 ' + T('nowThinking')]
}

function histHtml(r, now) {
  const rows = [...r.active.map(a => [a, true]), ...[...r.tools].reverse().map(a => [a, false])]
  if (!rows.length) return `<div class="hist"><span class="when">${esc(T('noTools'))}</span></div>`
  const more = r.toolCount > r.tools.length + r.active.length ? `<span class="when">${esc(T('olderCalls', { n: r.toolCount - r.tools.length - r.active.length }))}</span>` : ''
  return '<div class="hist">' + rows.map(([a, running]) =>
    `<div class="row"><span class="sq k-${kindOf(a)}${running ? ' pulse' : ''}"></span><span class="tool">${esc(toolLabel(a.tool))}</span><span class="what" title="${esc(a.summary)}">${esc(a.summary)}</span><span class="when">${esc(running ? T('inFlight') + ' ' + took(a, now) : took(a, now) + ' · ' + T('ago', { x: ago(now - a.endedAt) }))}</span></div>`).join('') + more + '</div>'
}

function cardHtml(s, r, isMain, now, nameOf, people) {
  const p = people.get(r.type)
  const live = isMain ? s.isAlive : LIVE.has(r.status)
  const st = STATUS[r.status]
  const color = isMain ? 'var(--green)' : (st?.[0] ?? 'var(--gray)')
  const label = isMain ? '' : (st ? T(st[1]) : r.status)
  const accent = r.ask ? 'var(--red)' : color
  const name = isMain ? T('main') : (p?.name ?? r.type)
  const role = isMain ? T('you') : (p?.role ?? '')
  const hue = isMain ? 268 : hueOf(p?.group || r.type)
  const beat = !isMain && (r.status === 'running' || r.status === 'pending') && s.isAlive
  const line = live && s.isAlive ? nowLine(isMain ? { ...r, status: 'running' } : r, s.runs, nameOf, now) : null
  const showLine = isMain && !r.active.length ? null : line
  const run = isMain ? 'main' : r.id
  const key = s.sid + ':' + run
  const squares = [...r.tools.slice(-36), ...r.active].map(a =>
    `<span class="sq k-${kindOf(a)}${a.endedAt === undefined ? ' pulse' : ''}" title="${esc(toolLabel(a.tool) + (a.summary ? ': ' + a.summary : '') + ' · ' + (a.endedAt === undefined ? T('inFlight') : took(a, now)))}"></span>`).join('')
  const state = isMain ? '' : `${r.ask ? T('stAsk') : label} · ${ago((r.endedAt ?? now) - r.startedAt)}`
  const task = isMain ? T('mainSummary', { n: r.toolCount, m: s.runs.length }) : r.description
  const stuck = live && s.isAlive ? stuckOf(r, now) : ''
  const sel = panel?.sid === s.sid && panel.run === run
  const x = isMain ? '' : `<button class="x" data-hide-sid="${esc(s.sid)}" data-hide-run="${esc(r.id)}" data-focus="${esc('x:' + key)}" aria-label="${esc(T('hideX', { x: name }))}" title="${esc(T('hideX', { x: name }))}">×</button>`
  return `<div class="card ${live ? 'live' : 'done'}${sel ? ' sel' : ''}" style="--accent:${accent}" data-sid="${esc(s.sid)}" data-run="${esc(run)}" data-focus="${esc('c:' + key)}" tabindex="0" role="button" aria-label="${esc(T('openChat', { x: name }))}">
    <div class="avatar${beat ? ' beat' : ''}" style="background:hsl(${hue} 62% 46%)">${isMain ? '◆' : esc(initials(name))}<i></i></div>
    <div><div class="l1"><span class="name">${esc(name)}</span><span class="role">${esc(role)}</span><span class="state">${esc(state)}</span>${x}</div>
      <div class="task" title="${esc(task)}">${esc(task)}</div>
      ${showLine ? `<div class="nowl ${showLine[0]}">${esc(showLine[1])}</div>` : ''}
      <div class="strip">${squares}<span class="count">${esc(T('nTools', { n: r.toolCount }))}</span>${stuck ? `<span class="stuck" title="${esc(T(stuck))}">⧗ ${esc(T('stuck'))}</span>` : ''}${useHtml(s.usage?.[run])}</div></div></div>`
}

function sessionHtml(s, now, withDone) {
  const people = new Map((s.people ?? []).map(p => [p.slug, p]))
  const nameOf = t => people.get(t)?.name ?? t
  const hid = HID.get(s.sid)
  const ids = new Set(s.runs.map(r => r.id))
  const kids = new Map()
  for (const r of s.runs) { const k = r.parentId && ids.has(r.parentId) ? r.parentId : ''; kids.set(k, [...(kids.get(k) ?? []), r]) }
  const visible = r => !hid.all.has(r.id) && (withDone || LIVE.has(r.status) || (kids.get(r.id) ?? []).some(visible))
  const order = []
  const node = (r, isMain) => {
    order.push([r, isMain])
    const ch = (kids.get(isMain ? '' : r.id) ?? []).filter(visible)
    const live = isMain || (LIVE.has(r.status) && r.status !== 'idle')
    const edge = r.status === 'waiting' ? 'var(--amber)' : 'var(--green)'
    return `<div class="node${live ? ' live' : ''}" style="--edge:${edge}">${cardHtml(s, r, isMain, now, nameOf, people)}${ch.length ? `<div class="kids">${ch.map(c => node(c, false)).join('')}</div>` : ''}</div>`
  }
  const tree = node(s.root, true)
  const running = s.runs.filter(r => r.status === 'running' || r.status === 'pending').length

  const lanes = order.filter(([r, isMain]) => !isMain || r.tools.length + r.active.length)
  const starts = lanes.flatMap(([r, isMain]) => [isMain ? Infinity : r.startedAt, ...r.tools.map(a => a.startedAt), ...r.active.map(a => a.startedAt)])
  const end = s.isAlive ? now : s.updatedAt
  const t0 = Math.min(...starts, end), span = Math.max(1000, end - t0)
  const pct = t => (Math.max(0, Math.min(1, (t - t0) / span)) * 100).toFixed(2)
  const tl = lanes.length < 2 && !lanes.some(([r]) => r.tools.length) ? '' : `<div class="tl"><h3>${esc(T('timeline'))} <small>${esc(T('lastSpan', { x: ago(span) }))}</small></h3>${lanes.map(([r, isMain]) => {
    const who = isMain ? T('main') : nameOf(r.type)
    const color = STATUS[r.status]?.[0] ?? 'var(--gray)'
    const life = isMain ? '' : `<span class="life" style="left:${pct(r.startedAt)}%;width:${(pct(r.endedAt ?? end) - pct(r.startedAt)).toFixed(2)}%;background:${color}"></span>`
    const bars = [...r.tools, ...r.active].map(a => `<span class="bar k-${kindOf(a)}${a.endedAt === undefined && s.isAlive ? ' pulse' : ''}" style="left:${pct(a.startedAt)}%;width:${(pct(a.endedAt ?? end) - pct(a.startedAt)).toFixed(2)}%" title="${esc(`${who} · ${toolLabel(a.tool)}${a.summary ? ': ' + a.summary : ''} · ${a.endedAt === undefined ? T('inFlight') : took(a, now)}`)}"></span>`).join('')
    return `<div class="lane"><span class="who" title="${esc(who)}">${esc(who)}</span><span class="track">${life}${bars}</span></div>`
  }).join('')}<div class="legend">${Object.entries(KINDS).map(([k, v]) => `<span><span class="sq k-${k}"></span>${esc(T(v))}</span>`).join('')}</div></div>`

  // The session's own name leads; the project folder follows it.
  const folder = folderOf(s)
  const title = titleOf(s)
  const sum = s.isAlive ? T('sessionSummary', { a: running, b: s.runs.length }) : T('closedAgo', { x: ago(now - s.updatedAt) })
  const use = Object.values(s.usage ?? {})
  const tokens = use.length ? ` · ${T('tokens', { x: fmtN(use.reduce((n, u) => n + (u.in || 0) + (u.out || 0), 0)) })}` : ''
  const tip = use.length ? T('usageTip', { a: num(use.reduce((n, u) => n + (u.in || 0), 0)), b: num(use.reduce((n, u) => n + (u.cached || 0), 0)), c: num(use.reduce((n, u) => n + (u.out || 0), 0)) }) : ''
  return `<section class="session${s.isAlive ? '' : ' dead'}"><div class="shead"><span class="dot ${s.isAlive ? (running ? 'green pulse' : 'green') : ''}"></span><h2>${esc(title)}</h2>${s.title && folder ? `<span class="proj">${esc(folder)}</span>` : ''}<span class="path" title="${esc(s.cwd)}">${esc(s.cwd)}</span><span class="sum" title="${esc(tip)}">${esc(sum + tokens)}</span><button class="x" data-hide-sid="${esc(s.sid)}" data-focus="${esc('xs:' + s.sid)}" aria-label="${esc(T('hideX', { x: title }))}" title="${esc(T('hideX', { x: title }))}">×</button></div><div class="tree">${tree}</div>${tl}</section>`
}

// Sets innerHTML only when it changed, so buttons keep focus and text stays selectable.
const put = (el, html) => { if (el.dataset.html !== html) { el.innerHTML = html; el.dataset.html = html } }

function render() {
  const now = Date.now() + skew
  const fresh = DEMO || Date.now() - lastOk < 4000
  $('connDot').className = 'dot ' + (fresh ? 'green' : lastOk ? 'red' : '')
  $('connText').textContent = fresh ? T('connLive') : lastOk ? T('connLost') : T('connWait')
  if (!data) return
  const withDone = $('optDone').checked
  const withDead = $('optDead').checked
  HID = new Map(data.sessions.map(s => [s.sid, hiddenOf(s)]))
  for (const s of data.sessions) if (!order.has(s.sid)) order.set(s.sid, order.size)
  const base = data.sessions.filter(s => s.isAlive || withDead)
    .sort((a, b) => Number(b.isAlive) - Number(a.isAlive) || order.get(a.sid) - order.get(b.sid))
  const shown = base.filter(s => !HID.get(s.sid).s)
  if (tab !== 'all' && !shown.some(s => s.sid === tab)) tab = 'all'

  // The tab title counts runs waiting for approval in every open session, hidden or not.
  const asks = data.sessions.filter(s => s.isAlive).reduce((n, s) => n + [s.root, ...s.runs].filter(r => r.ask).length, 0)
  document.title = asks ? `(${asks}) ${T('appName')}` : T('appName')

  const tabsHtml = [`<button class="tab${tab === 'all' ? ' on' : ''}" data-tab="all" data-focus="t:all" role="tab" aria-selected="${tab === 'all'}"><span class="lbl">${esc(T('tabAll'))}</span><span class="n">${shown.length}</span></button>`,
    ...shown.map(s => {
      const run = s.runs.filter(r => r.status === 'running' || r.status === 'pending').length
      const proj = folderOf(s)
      const name = titleOf(s)
      return `<span class="tabw"><button class="tab${tab === s.sid ? ' on' : ''}${s.isAlive ? '' : ' dead'}" data-tab="${esc(s.sid)}" data-focus="${esc('t:' + s.sid)}" role="tab" aria-selected="${tab === s.sid}" title="${esc(`${name}${s.title ? ' · ' + s.cwd : ''}`)}"><span class="dot ${s.isAlive ? (run ? 'green pulse' : 'green') : ''}"></span><span class="lbl"><span class="t">${esc(name)}</span>${s.title && proj ? `<span class="p">${esc(proj)}</span>` : ''}</span>${run ? `<span class="n">${run}</span>` : ''}</button><button class="x" data-hide-sid="${esc(s.sid)}" data-focus="${esc('xt:' + s.sid)}" aria-label="${esc(T('hideX', { x: name }))}" title="${esc(T('hideX', { x: name }))}">×</button></span>`
    })].join('')
  put($('tabs'), tabsHtml)

  // Hidden list and the strip for hidden work that needs the person.
  const rows = [], alerts = []
  for (const s of base) {
    const h = HID.get(s.sid), title = titleOf(s)
    const row = (name, sub, run) => rows.push(`<div class="hrow"><span class="hn"><b>${esc(name)}</b><small>${esc(sub)}</small></span><button class="btn" data-show-sid="${esc(s.sid)}"${run ? ` data-show-run="${esc(run)}"` : ''} data-focus="${esc('r:' + s.sid + ':' + (run ?? ''))}" aria-label="${esc(T('restoreX', { x: name }))}">${esc(T('restore'))}</button></div>`)
    if (h.s) row(title, T('hiddenWhole'), null)
    for (const id of h.own) { const r = s.runs.find(x => x.id === id); if (r) row(whoOf(s, r), r.description ? `${title} · ${r.description}` : title, id) }
    if (!s.isAlive) continue
    for (const r of [s.root, ...s.runs]) {
      const under = h.s ? null : h.all.get(r.id)
      if (!h.s && !under) continue
      if (!r.ask && r.status !== 'failed') continue
      const who = `${whoOf(s, r)} · ${title}`
      const text = r.ask ? T('attnAsk', { who, x: r.ask }) : T('attnFailed', { who, x: r.description || T('stFailed') })
      alerts.push(`<div class="alert"><span title="${esc(text)}">${r.ask ? '🔒' : '✕'} ${esc(text)}</span><button class="btn" data-show-sid="${esc(s.sid)}"${under ? ` data-show-run="${esc(under)}"` : ''} data-focus="${esc('a:' + s.sid + ':' + r.id)}">${esc(T('restore'))}</button></div>`)
    }
  }
  if (notice) alerts.push(`<div class="alert note"><span>${esc(T(notice))}</span></div>`)
  put($('attn'), alerts.join(''))
  const btn = $('hiddenBtn')
  btn.hidden = !rows.length
  btn.textContent = T('hiddenBtn', { n: rows.length })
  if (!rows.length) togglePop(false)
  put($('hiddenList'), rows.join('') + (notice ? `<p>${esc(T(notice))}</p>` : ''))

  const view = tab === 'all' ? shown : shown.filter(s => s.sid === tab)
  const alive = view.filter(s => s.isAlive)
  const all = alive.flatMap(s => s.runs.filter(r => !HID.get(s.sid).all.has(r.id)))
  const running = all.filter(r => r.status === 'running' || r.status === 'pending').length
  const waiting = all.filter(r => r.status === 'waiting' || r.status === 'idle' || r.ask).length
  const failed = all.filter(r => r.status === 'failed' || r.status === 'killed').length
  const done = all.filter(r => !LIVE.has(r.status)).length
  const tools = alive.reduce((n, s) => n + s.root.toolCount, 0) + all.reduce((m, r) => m + r.toolCount, 0)
  $('tiles').innerHTML = [
    ['green' + (running ? ' pulse' : ''), running, T('tileRunning')], ['amber', waiting, T('tileWaiting')],
    [failed ? 'red' : '', done, failed ? T('tileDoneErr', { n: failed }) : T('tileDone')], ['', tools, tab === 'all' ? T('tileToolsSessions', { n: alive.length }) : T('tileTools')],
  ].map(([c, n, l]) => `<div class="tile"><span class="dot ${c}" style="display:inline-block"></span><b>${n}</b><span>${esc(l)}</span></div>`).join('')

  // The panel closes when what it shows was just hidden.
  if (panel) {
    const s = data.sessions.find(x => x.sid === panel.sid), h = s && HID.get(s.sid)
    if (h && (h.s || h.all.has(panel.run))) closePanel(false)
  }
  const box = $('sessions')
  const focus = document.activeElement?.closest?.('#sessions [data-focus]')?.dataset.focus
  box.classList.toggle('one', tab !== 'all')
  box.innerHTML = view.length ? view.map(s => sessionHtml(s, now, withDone)).join('')
    : `<div class="empty"><b>${esc(T('emptyTitle'))}</b>${esc(T('emptyBody'))}${data.sessions.length ? ' ' + esc(T('emptyClosed')) : ''}</div>`
  if (focus) box.querySelector(`[data-focus="${CSS.escape(focus)}"]`)?.focus({ preventScroll: true })
  renderPanel(now)
}

// Hide / bring back: applied at once, then saved on the server (or in memory for the demo).
async function setHidden(sid, run, hidden) {
  const k = run ? sid + ' ' + run : sid
  const o = { v: hidden, after: Infinity }
  over.set(k, o)
  render()
  if (DEMO) { demoHide(sid, run, hidden); over.delete(k); return poll() }
  try {
    const res = await fetch('/api/hide', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(run ? { sid, run, hidden } : { sid, hidden }) })
    const j = await res.json()
    if (!res.ok || !j?.ok) throw 0
    o.after = pollNo
    notice = ''
  } catch {
    if (over.get(k) === o) over.delete(k)
    notice = 'needRestart'
  }
  render()
}

function togglePop(on) {
  const pop = $('hiddenBox'), btn = $('hiddenBtn')
  if (on) pop.style.top = document.querySelector('header').getBoundingClientRect().bottom + 6 + 'px'
  pop.hidden = !on
  btn.setAttribute('aria-expanded', String(on))
}

// The side panel: conversation and tool history of one agent. It lives outside
// the re-rendered container; the conversation is appended to, never rebuilt.
let panel = null
const isBottom = el => el.scrollHeight - el.scrollTop - el.clientHeight < 40
function openPanel(sid, run) {
  if (panel?.sid === sid && panel.run === run) return closePanel(true)
  const tabWas = panel?.tab ?? 'chat'
  closePanel(false)
  panel = { sid, run, tab: tabWas, last: -1, first: -1, state: 'loading', stick: true, timer: 0 }
  $('chatList').replaceChildren()
  $('chatOlder').textContent = ''
  $('histBox').dataset.html = ''
  $('side').hidden = false
  setPanelTab(panel.tab)
  pullChat(panel)
  render()
  $('sideClose').focus({ preventScroll: true })
}
function closePanel(again) {
  if (!panel) return
  clearTimeout(panel.timer)
  const key = panel.sid + ':' + panel.run
  panel = null
  $('side').hidden = true
  if (again) { render(); document.querySelector(`#sessions [data-focus="${CSS.escape('c:' + key)}"]`)?.focus({ preventScroll: true }) }
}
function setPanelTab(t) {
  panel.tab = t
  for (const [id, box, on] of [['stChat', 'chatBox', t === 'chat'], ['stHist', 'histBox', t === 'hist']]) {
    $(id).classList.toggle('on', on)
    $(id).setAttribute('aria-selected', String(on))
    $(box).hidden = !on
  }
  if (t === 'chat' && panel.stick) $('chatBox').scrollTop = $('chatBox').scrollHeight
}
async function pullChat(p) {
  if (panel !== p) return
  try {
    const after = p.last >= 0 ? p.last : undefined
    const res = DEMO ? demoChat(demoStart, p.sid, p.run, after)
      : await fetch(`/api/chat?sid=${encodeURIComponent(p.sid)}&run=${encodeURIComponent(p.run)}${after === undefined ? '' : '&after=' + after}`, { cache: 'no-store' })
        .then(r => { if (!r.ok) throw 0; return r.json() })
    if (panel !== p) return
    if (typeof res?.found !== 'boolean' || !Array.isArray(res.items)) throw 0
    p.state = res.found ? 'ok' : 'missing'
    addItems(p, res.items)
  } catch {
    if (panel !== p) return
    p.state = 'error'
  }
  chatNotes(p)
  p.timer = setTimeout(() => pullChat(p), p.state === 'error' ? 10000 : 1500)
}
const textHtml = s => String(s ?? '').split(/```[^\n`]*\n?([\s\S]*?)```/).map((part, i) => i % 2 ? `<pre>${esc(part.replace(/\n$/, ''))}</pre>` : esc(part)).join('')
function addItems(p, items) {
  const fresh = items.filter(it => Number.isInteger(it?.i) && it.i > p.last).sort((a, b) => a.i - b.i)
  if (!fresh.length) return
  const list = $('chatList'), box = $('chatBox')
  for (const it of fresh) {
    const el = document.createElement('div')
    el.dataset.i = it.i
    if (it.role === 'tool') {
      el.className = 'chip' + (it.isError ? ' err' : '')
      el.innerHTML = `<span class="sq k-${kindOf(it)}"></span><b>${esc(toolLabel(it.tool))}</b><span class="cs">${esc(it.summary ?? '')}</span>`
    } else {
      el.className = 'msg ' + (it.role === 'user' ? 'user' : 'assistant')
      el.innerHTML = `<div class="mlbl"></div><div class="mtext">${textHtml(it.text)}</div>`
    }
    if (it.at) el.title = (it.role === 'tool' ? `${it.tool}: ${it.summary ?? ''} · ` : '') + new Date(it.at).toLocaleTimeString(lang)
    list.append(el)
  }
  p.last = fresh[fresh.length - 1].i
  while (list.children.length > 200) list.firstElementChild.remove()
  p.first = Number(list.firstElementChild.dataset.i)
  labelChat(p)
  if (p.stick && !box.hidden) box.scrollTop = box.scrollHeight
}
function chatNotes(p) {
  const note = p.state === 'loading' ? T('chatLoading') : p.state === 'missing' ? T('chatNotFound') : p.state === 'error' ? T('needRestart')
    : $('chatList').children.length ? '' : T('chatEmpty')
  if ($('chatNote').textContent !== note) $('chatNote').textContent = note
  const older = p.first > 0 ? T('chatOlder') : ''
  if ($('chatOlder').textContent !== older) $('chatOlder').textContent = older
}
// A subagent's first prompt is the task it was given; once it has ended, its last reply is its report.
function labelChat(p) {
  const s = data?.sessions.find(x => x.sid === p.sid), r = s && runOf(s, p.run)
  const list = $('chatList')
  const first = p.run !== 'main' && p.first === 0 ? list.querySelector('.msg.user') : null
  const msgs = list.querySelectorAll('.msg.assistant')
  const report = p.run !== 'main' && r && !LIVE.has(r.status) ? msgs[msgs.length - 1] : null
  for (const el of list.querySelectorAll('.mlbl')) {
    const m = el.parentElement, want = m === first ? T('chatTask') : m === report ? T('chatReport') : ''
    if (el.textContent !== want) el.textContent = want
  }
}
function renderPanel(now) {
  if (!panel) return
  const s = data.sessions.find(x => x.sid === panel.sid), r = s && runOf(s, panel.run)
  const p = r && (s.people ?? []).find(x => x.slug === r.type)
  const name = !r ? '' : r === s.root ? T('main') : (p?.name ?? r.type) + (p?.role ? ' · ' + p.role : '')
  if ($('sideName').textContent !== name) $('sideName').textContent = name
  const sub = s ? (r && r !== s.root && r.description ? `${titleOf(s)} · ${r.description}` : titleOf(s)) : ''
  if ($('sideSub').textContent !== sub) { $('sideSub').textContent = sub; $('sideSub').title = sub }
  labelChat(panel)
  chatNotes(panel)
  if (panel.tab === 'hist' && r) {
    const hb = $('histBox'), top = hb.scrollTop
    put(hb, histHtml(r, now))
    hb.scrollTop = top
  }
}

$('sessions').addEventListener('click', e => {
  if (e.target.closest('button')) return
  const card = e.target.closest('.card[data-sid]')
  if (card) openPanel(card.dataset.sid, card.dataset.run)
})
$('sessions').addEventListener('keydown', e => {
  if ((e.key !== 'Enter' && e.key !== ' ') || !e.target.matches('.card[data-sid]')) return
  e.preventDefault()
  openPanel(e.target.dataset.sid, e.target.dataset.run)
})
$('tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-tab]')
  if (!b) return
  tab = b.dataset.tab
  try { localStorage.setItem('agent-radar-tab', tab) } catch {}
  render()
})
document.addEventListener('click', e => {
  const h = e.target.closest('[data-hide-sid]'), u = e.target.closest('[data-show-sid]')
  if (h) setHidden(h.dataset.hideSid, h.dataset.hideRun, true)
  else if (u) setHidden(u.dataset.showSid, u.dataset.showRun, false)
  else if (e.target.closest('#hiddenBtn')) togglePop($('hiddenBox').hidden)
  else if (!e.target.closest('#hiddenBox')) togglePop(false)
})
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return
  if (!$('hiddenBox').hidden) { togglePop(false); $('hiddenBtn').focus() } else if (panel) closePanel(true)
})
$('sideClose').addEventListener('click', () => closePanel(true))
$('stChat').addEventListener('click', () => { setPanelTab('chat'); render() })
$('stHist').addEventListener('click', () => { setPanelTab('hist'); render() })
$('chatBox').addEventListener('scroll', () => { if (panel && !$('chatBox').hidden) panel.stick = isBottom($('chatBox')) })
for (const id of ['optDone', 'optDead']) $(id).addEventListener('change', render)
const picker = $('lang')
picker.innerHTML = Object.keys(MESSAGES).map(l => `<option value="${l}">${esc(LANGUAGE_NAMES[l] ?? l)}</option>`).join('')
picker.value = lang
picker.addEventListener('change', () => { lang = picker.value; localStorage.setItem('agent-radar-lang', lang); chrome(); render() })

const demoStart = Date.now()
async function poll() {
  const no = ++pollNo
  if (DEMO) {
    data = { now: Date.now(), sessions: demoSessions(demoStart) }
  } else {
    try {
      const res = await fetch('/api/state', { cache: 'no-store' })
      data = await res.json()
      skew = data.now - Date.now()
      lastOk = Date.now()
      for (const [k, o] of over) if (no > o.after) over.delete(k)
    } catch {}
  }
  render()
}
chrome()
poll()
setInterval(poll, 1000)
</script>
</body>
</html>
